name: HERMES CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-unit-tests:
    name: Lint, Schema Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings pyyaml fastavro pyarrow numpy scikit-learn joblib prometheus-client ruff

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Validate Avro Schemas
        run: |
          python -c "import json; json.load(open('infrastructure/kafka/schemas/transaction_event_v1.avsc')); json.load(open('infrastructure/kafka/schemas/fraud_decision_v1.avsc'))"

      - name: Run Unit Test Suites
        run: |
          pytest services/transaction-simulator/tests/ services/transaction-processor/tests/ -v
