[project]
name = "transaction-simulator"
version = "0.1.0"
description = "HERMES synthetic transaction generator (Service 6)"
requires-python = ">=3.11"
dependencies = [
    "faker>=26.0.0",
    "pyyaml>=6.0.1",
    "aiokafka>=0.11.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
