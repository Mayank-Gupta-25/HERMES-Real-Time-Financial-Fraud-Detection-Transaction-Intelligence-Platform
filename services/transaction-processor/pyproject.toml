[tool.poetry]
name = "hermes-transaction-processor"
version = "0.1.0"
description = "HERMES transaction-processor Service"
authors = ["Mayank"]

[tool.poetry.dependencies]
python = "^3.11"
apache-flink = "^1.18.0"
confluent-kafka = "^2.3.0"
redis = "^5.0.0"
