services:
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256M -Xmx512M

  transaction-processor:
    mem_limit: 1g
    volumes:
      - ./services/transaction-processor/app:/app/app
      - flink_checkpoints:/opt/flink/checkpoints

  api-gateway:
    volumes:
      - ./services/api-gateway/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  fraud-detection:
    volumes:
      - ./services/fraud-detection/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  analytics-service:
    volumes:
      - ./services/analytics-service/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  notification-service:
    volumes:
      - ./services/notification-service/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  transaction-simulator:
    volumes:
      - ./services/transaction-simulator/app:/app/app
      - ./services/transaction-simulator/data:/app/data

volumes:
  flink_checkpoints:
