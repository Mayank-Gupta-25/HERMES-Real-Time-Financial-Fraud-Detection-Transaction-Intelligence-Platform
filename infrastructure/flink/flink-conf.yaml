# =============================================================================
# HERMES Apache Flink Configuration (MOD-02 / MOD-08)
# =============================================================================
jobmanager.rpc.address: jobmanager
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m
taskmanager.memory.process.size: 1728m
taskmanager.numberOfTaskSlots: 6
parallelism.default: 6

# Stateful Checkpointing & Fault Tolerance (Lab 6-7-8 Section 5 / NFR-03)
execution.checkpointing.interval: 10000
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 60000
execution.checkpointing.min-pause: 5000
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

# State Backend & Durable Storage
state.backend.type: hashmap
state.checkpoints.dir: file:///opt/flink/checkpoints
state.savepoints.dir: file:///opt/flink/savepoints
state.backend.incremental: true

# Restart Strategy
restart-strategy.type: fixed-delay
restart-strategy.fixed-delay.attempts: 5
restart-strategy.fixed-delay.delay: 5 s

# Event-Time Watermarks
pipeline.auto-watermark-interval: 200 ms

# Web UI & Prometheus Metrics
rest.port: 8082
rest.address: 0.0.0.0
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249
