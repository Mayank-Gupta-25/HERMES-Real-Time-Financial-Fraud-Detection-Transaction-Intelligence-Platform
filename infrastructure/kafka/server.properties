# Reference settings for the Compose Kafka broker. Compose configures the
# confluentinc/cp-kafka image with matching KAFKA_* environment variables;
# this file is not mounted or loaded by Compose. Keep these values aligned.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:29093
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://localhost:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL
log.dirs=/var/lib/kafka/data
num.partitions=6
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
min.insync.replicas=1
