global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    platform: "hermes-fraud-detection"
    environment: "production"

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "fraud-detection"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fraud-detection:8000"]

  - job_name: "analytics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics-service:8000"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification-service:8000"]

  - job_name: "transaction-processor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["transaction-processor:8000"]
