# =============================================================================
# HERMES PostgreSQL 16 Operational Database Configuration
# Module: MOD-05 (MOD-05-FN-01)
# Owner: Kushagra
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Configuration (Tuned for Containerized Operational Workload)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Write-Ahead Log & Checkpoints (High-Throughput Upsert Tuning)
wal_level = replica
synchronous_commit = on
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# Query Planner & Indexing
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging & Diagnostics
log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 250
log_checkpoints = on
log_lock_waits = on
