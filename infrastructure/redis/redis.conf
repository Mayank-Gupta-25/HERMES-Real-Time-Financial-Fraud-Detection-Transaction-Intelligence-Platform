# =============================================================================
# HERMES Redis 7 Hot Feature Store, Velocity Window & Query Cache Config
# Module: MOD-05 (MOD-05-FN-02 / MOD-05-FN-03)
# Owner: Kushagra
# =============================================================================

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# Memory & Eviction Policy (Lab 6-7-8 Section 6)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence & Durability (AOF + RDB hybrid)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Latency & Non-blocking Deletes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
